[package]
name = "ph-sht45-hts"
version = "0.1.0-incubating.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Async no_std driver for the Sensirion SHT45 humidity and temperature sensor over abstract I2C."
repository.workspace = true
# The README carries the lifecycle, distribution, model-conformance, and
# physical-evidence disclosure, and crates.io and docs.rs render it. Restating
# status in `description` would create a second copy to keep true.
readme = "README.md"
publish = false
keywords = ["sht45", "sensirion", "humidity", "i2c", "embedded-hal-driver"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"

[dev-dependencies]
futures-lite = "2"
