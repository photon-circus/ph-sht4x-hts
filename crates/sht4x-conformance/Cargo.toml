[package]
name = "ph-sht4x-hts-conformance"
version = "0.1.0-incubating.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Unpublished host-only conformance checks for public SHT45 operations."
repository.workspace = true
readme = "README.md"
publish = false
# No `keywords` or `categories`: those fields classify a crate for a registry
# this package does not enter.

# The library target carries no conformance code; the integration test is the
# whole package. Declaring the driver and the model here would put a runtime
# dependency edge on a library that uses neither, overstating the coupling that
# the behavioral-model standard relies on being directly inspectable.
[dev-dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
futures-lite = "2"
ph-sht4x-hts = { path = "../sht4x" }
ph-sht4x-hts-model = { path = "../sht4x-model" }
